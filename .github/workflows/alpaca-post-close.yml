name: Alpaca post-close next-session setups
on:
  workflow_dispatch:
  schedule:
    - cron: '35 20,21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: cgt2k-dedicated-alpaca
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' -r requirements-paper.txt
      - run: python -m pytest -q tests test_paper_*.py test_discovery_pipeline.py test_workflow_summary.py
      - name: Load optional discoveries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python discovery_state.py load --optional
      - name: Read-only completed-session research
        id: runner
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
          ALPACA_EXPECTED_PAPER_ACCOUNT_ID: ${{ vars.ALPACA_EXPECTED_PAPER_ACCOUNT_ID }}
          ALPACA_PAPER_STRATEGY: ${{ vars.ALPACA_PAPER_STRATEGY || 'compression_family' }}
          ALPACA_DATA_FEED: ${{ vars.ALPACA_DATA_FEED || 'iex' }}
        run: |
          set -o pipefail
          mkdir -p reports/paper
          GITHUB_STEP_SUMMARY='' python paper_pipeline.py --mode post-close | tee reports/paper/runner.log
      - name: Findings summary
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.runner.outcome }}
        run: python workflow_summary.py --kind paper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-close-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/paper/
          if-no-files-found: warn
          retention-days: 30
